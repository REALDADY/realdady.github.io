name: Deploy to GitHub Pages

on:
  push:
    branches: [main, portfolio-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile is generated on Windows; npm install adds the Linux-only native packages.
      - run: npm install --no-audit --no-fund
      - name: Build the prerendered static site
        run: npm run build:vercel
        env:
          VITE_SITE_URL: https://real3adi.space
      - name: Check the prerendered output
        run: node --test tests/vercel-prerender.test.mjs
        env:
          VITE_SITE_URL: https://real3adi.space
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vercel-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
